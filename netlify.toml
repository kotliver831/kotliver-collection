[build]
  command = "cd kotliver-collection-src/kotliver-collection-src-v1.1.0 && npm install && npm run build"
  publish = "kotliver-collection-src/kotliver-collection-src-v1.1.0/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-package-lock"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
